[project]
name = "callme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "laoubaid", email = "abaidhossin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[project.scripts]
callme = "callme:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
